version: "3.8"

services:
	jenkins-exporter:
		build: .
		ports:
			- "8123:8123"
		environment:
			- JE_JENKINS_URL=${JENKINS_URL:-http://jenkins:8080}
			- JE_JENKINS_USER=${JENKINS_USER:-admin}
			- JE_JENKINS_PASSWORD=${JENKINS_PASSWORD:-admin}
			- JE_ENABLE_BUILD_ENV_EXTRACTION=true
			- JE_BUILD_HISTORY_LIMIT=5
			- JE_POLL_INTERVAL=30s
			- JE_DEBUG=false
		volumes:
			- ./jenkins-exporter.state.json:/app/jenkins-exporter.state.json
		restart: unless-stopped

	# Test Prometheus for scraping metrics
	prometheus:
		image: prom/prometheus:latest
		ports:
			- "9090:9090"
		volumes:
			- ./prometheus.test.yml:/etc/prometheus/prometheus.yml
		command:
			- "--config.file=/etc/prometheus/prometheus.yml"
			- "--storage.tsdb.path=/prometheus"
			- "--web.console.libraries=/etc/prometheus/console_libraries"
			- "--web.console.templates=/etc/prometheus/consoles"
			- "--storage.tsdb.retention.time=200h"
			- "--web.enable-lifecycle"
		restart: unless-stopped